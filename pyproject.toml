[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-lite"
version = "0.1.0"
description = "LeRobot-derived SO-100/SO-101 motor control without machine-learning dependencies"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "feetech-servo-sdk==1.0.0",
  "pyserial>=3.5,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
lerobot-lite = "lerobot_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot_lite = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/lerobot_lite/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
